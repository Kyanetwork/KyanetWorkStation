<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KyanetWorkStation 综合管理面板 | Kyanetwork</title>
  <style>
    :root{--bg:#f2f8ff;--card:#fff;--text:#10233f;--muted:#5a7295;--bd:#d8e6ff;--brand:#1b6ef3;--ok:#16865c;--danger:#c43546;--stat-bg:#fafdff;--stat-k:#4b648a}
    body[data-theme="dark"]{--bg:#0f1728;--card:#17233c;--text:#ecf3ff;--muted:#9cb2d9;--bd:#2d3f62;--brand:#4f9dff;--ok:#7de4b0;--danger:#ff8898;--stat-bg:#203253;--stat-k:#bfd2f6}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:20px 14px 36px}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
    .hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.6}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .toolbar input,.toolbar select,.toolbar button,.toolbar textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;background:var(--card);color:var(--text)}
    .toolbar textarea{min-height:88px;resize:vertical}
    .toolbar button{cursor:pointer}.toolbar .primary{background:var(--brand);color:#fff;border-color:var(--brand)}
    .toolbar .danger{color:var(--danger);background:#fff6f8;border-color:#f3c2ca}
    .tabs{display:flex;gap:8px;margin-bottom:10px}.tab{padding:7px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
    .tab.active{background:#e9f2ff;border-color:#aecdff;color:#0e4ca9}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:10px 0}
    .stat{border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--stat-bg)}.stat .k{font-size:12px;color:var(--stat-k)}.stat .v{font-weight:700;font-size:20px;color:var(--text)}
    .list{display:grid;gap:8px}.item{border:1px solid var(--bd);border-left:4px solid #9fc0f6;border-radius:8px;padding:10px;background:var(--card)}
    .item h3{margin:0 0 6px;font-size:16px}.meta{font-size:12px;color:var(--muted);line-height:1.6}.content{white-space:pre-wrap;line-height:1.6;margin:8px 0}
    .ops{display:flex;gap:6px;flex-wrap:wrap}.ops button,.ops input,.ops textarea{border:1px solid var(--bd);border-radius:7px;padding:5px 8px;font-size:12px;background:var(--card);color:var(--text)}
    .ops textarea{width:min(100%,460px);min-height:62px;resize:vertical;font-family:inherit}
    .ops button{cursor:pointer}.ops .del{color:var(--danger);border-color:#f3c2ca;background:#fff6f8}
    .ops button.is-busy{position:relative;padding-right:22px;opacity:.85;cursor:wait}
    .ops button.is-busy::after{content:"";position:absolute;right:8px;top:50%;width:10px;height:10px;margin-top:-6px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
    .toast-wrap{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:9999;pointer-events:none}
    .toast{min-width:220px;max-width:360px;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:13px;line-height:1.5;opacity:0;transform:translateY(8px);animation:toast-in .18s ease forwards}
    .toast.ok{border-color:#b8e9cc;background:#eaf8f0;color:#14523a}
    .toast.error{border-color:#f5c2ca;background:#fff1f4;color:#8e2633}
    .toast.hide{animation:toast-out .18s ease forwards}
    .pagebar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0}
    .msg{display:none;padding:8px 10px;border-radius:8px;border:1px solid transparent;font-size:13px}.msg.ok{display:block;color:var(--ok);background:#eaf8f0;border-color:#b8e9cc}.msg.error{display:block;color:var(--danger);background:#fff1f4;border-color:#f5c2ca}
    .hidden{display:none!important}.login{max-width:360px}
    .login input,.login button{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-top:8px;font:inherit;background:var(--card);color:var(--text)}
    .login button{background:var(--brand);color:#fff;border-color:var(--brand);cursor:pointer}
    .theme-btn{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--text);cursor:pointer;font:inherit;font-size:13px}
    .footer{margin-top:12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes toast-in{to{opacity:1;transform:translateY(0)}}
    @keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
    @media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card hero">
      <div class="toolbar" style="justify-content:space-between;margin-bottom:8px;">
        <h1 style="margin:0;">KyanetWorkStation 综合管理面板</h1>
        <button id="themeToggle" class="theme-btn">切换深色</button>
      </div>
      <p>统一管理反馈系统与 WorkTask 系统，可在同一面板切换不同板块进行筛选、状态更新、任务安排与导出。</p>
    </section>

    <section id="loginCard" class="card login">
      <h2>管理员登录</h2>
      <input id="username" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn">登录</button>
      <div id="loginMsg" class="msg"></div>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="card">
        <div class="toolbar">
          <strong id="loginState">未登录</strong>
          <button id="refreshBtn">刷新当前板块</button>
          <button id="logoutBtn" class="danger">退出登录</button>
          <span id="globalLoadTime">最近加载：-</span>
        </div>
        <div id="globalMsg" class="msg"></div>
        <div class="toolbar" style="margin-top:8px;">
          <input id="smtpTestTo" placeholder="SMTP 测试收件人（可选，支持中英文逗号/分号/换行/姓名<邮箱>，留空使用 SMTP_TO）" maxlength="1000">
          <button id="smtpTestBtn">发送 SMTP 测试邮件</button>
        </div>
        <div id="smtpTestMsg" class="msg"></div>
        <div class="toolbar" style="margin-top:8px;">
          <input id="webhookTestContent" placeholder="Webhook 测试附加内容（可选）" maxlength="300">
          <button id="webhookTestBtn">发送 Webhook 测试消息</button>
        </div>
        <div id="webhookTestMsg" class="msg"></div>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab active" id="tabFeedback">反馈管理</button>
          <button class="tab" id="tabWorktask">WorkTask 管理</button>
          <button class="tab" id="tabWorktaskCreate">本人任务录入</button>
        </div>

        <section id="moduleFeedback">
          <div class="toolbar">
            <select id="feedbackStatusFilter">
              <option value="">全部状态</option><option value="new">新反馈</option><option value="reviewed">已查看</option><option value="resolved">已解决</option><option value="notplanned">暂不处理</option>
            </select>
            <input id="feedbackKeyword" placeholder="搜索标题/内容/联系方式" maxlength="200">
            <button class="primary" id="feedbackSearchBtn">查询反馈</button>
            <button id="feedbackExportBtn">导出反馈 CSV</button>
          </div>
          <div class="pagebar"><span id="feedbackPageText">第 1 页</span><span id="feedbackPageSummary">总计 0 条</span></div>
          <div id="feedbackStats" class="grid"></div>
          <div id="feedbackList" class="list"></div>
          <div class="pagebar"><button id="feedbackPrevBtn">上一页</button><button id="feedbackNextBtn">下一页</button></div>
          <div id="feedbackMsg" class="msg"></div>
        </section>

        <section id="moduleWorktask" class="hidden">
          <div class="toolbar">
            <select id="worktaskStatusFilter">
              <option value="">全部状态</option><option value="new">新工单</option><option value="scheduled">已安排</option><option value="in_progress">进行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option>
            </select>
            <select id="worktaskPriorityFilter">
              <option value="">全部优先级</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="urgent">紧急</option>
            </select>
            <input id="worktaskKeyword" placeholder="搜索标题/内容/联系方式/负责人/标签" maxlength="200">
            <button class="primary" id="worktaskSearchBtn">查询 WorkTask</button>
            <button id="worktaskExportBtn">导出 WorkTask CSV</button>
          </div>
          <div class="pagebar"><span id="worktaskPageText">第 1 页</span><span id="worktaskPageSummary">总计 0 条</span></div>
          <div id="worktaskStats" class="grid"></div>
          <div id="worktaskList" class="list"></div>
          <div class="pagebar"><button id="worktaskPrevBtn">上一页</button><button id="worktaskNextBtn">下一页</button></div>
          <div id="worktaskMsg" class="msg"></div>
        </section>

        <section id="moduleWorktaskCreate" class="hidden">
          <div class="toolbar">
            <select id="createType">
              <option value="任务安排">任务安排</option>
              <option value="协作请求">协作请求</option>
              <option value="WorkTask提交">WorkTask提交</option>
              <option value="其他">其他</option>
            </select>
            <select id="createPriority">
              <option value="medium">优先级：中</option>
              <option value="low">优先级：低</option>
              <option value="high">优先级：高</option>
              <option value="urgent">优先级：紧急</option>
            </select>
            <select id="createStatus">
              <option value="">状态：自动</option>
              <option value="new">新工单</option>
              <option value="scheduled">已安排</option>
              <option value="in_progress">进行中</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <select id="createShowOnHome">
              <option value="0">主页展示：否</option>
              <option value="1">主页展示：是</option>
            </select>
          </div>
          <div class="toolbar">
            <input id="createTitle" placeholder="任务标题（必填）" maxlength="100">
            <input id="createAssignee" placeholder="负责人（可选）" maxlength="100">
            <input id="createExpectedAt" type="datetime-local" placeholder="期望时间">
            <input id="createScheduledAt" type="datetime-local" placeholder="计划时间">
          </div>
          <div class="toolbar">
            <input id="createTags" placeholder="标签（可选，如：系统维护,文档）" maxlength="200">
          </div>
          <div class="toolbar">
            <textarea id="createContent" rows="4" placeholder="任务详细说明（必填）" maxlength="3000"></textarea>
          </div>
          <div class="toolbar">
            <textarea id="createPublicReply" rows="2" placeholder="对外回复（可选，主页展示时可见）" maxlength="2000"></textarea>
            <textarea id="createAdminNote" rows="2" placeholder="管理员备注（仅后台可见）" maxlength="2000"></textarea>
          </div>
          <div class="toolbar">
            <button class="primary" id="createWorktaskBtn">创建本人任务</button>
            <button id="createWorktaskResetBtn" type="button">重置表单</button>
          </div>
          <div id="worktaskCreateMsg" class="msg"></div>
        </section>
      </div>
    </section>

    <footer class="footer">
      <p>© 2026 Kyanetwork All rights reserved.</p>
      <p>该面板用于反馈处理、WorkTask 安排与执行跟踪。</p>
    </footer>
  </main>
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>
  <script src="/theme.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
