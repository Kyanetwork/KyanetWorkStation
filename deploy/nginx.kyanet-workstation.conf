server {
    listen 80;
    server_name workstation.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name workstation.example.com;

    # 由 Certbot 或你现有证书体系管理
    ssl_certificate /etc/letsencrypt/live/workstation.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workstation.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
